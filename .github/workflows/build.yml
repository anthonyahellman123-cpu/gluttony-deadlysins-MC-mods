name: Build Roots of Sin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RootsOfSin-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
